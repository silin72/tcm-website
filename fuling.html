<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>茯苓 - 中草药详情</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Microsoft Yahei", sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .back-btn {
      display: inline-block;
      padding: 8px 16px;
      background: #e0e0e0;
      color: #333;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .detail-container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .herb-img-box {
      flex: 0 0 280px;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
    }
    .herb-detail-img {
      width: 100%;
      height: 250px;
      object-fit: contain;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .img-bottom-info {
      width: 100%;
      text-align: center;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }
    .img-info-item {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 5px;
    }
    .img-info-label {
      color: #333;
      font-weight: bold;
    }
    .herb-info-box {
      flex: 1;
      min-width: 300px;
      padding-top: 10px;
    }
    .herb-title {
      font-size: 28px;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }
    .herb-english {
      font-size: 16px;
      color: #999;
      margin-bottom: 15px;
      display: block;
    }
    .herb-tag {
      display: inline-block;
      background: #ff9800;
      color: white;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    .info-section {
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 2px solid #f0f0f0;
    }
    .section-content {
      font-size: 15px;
      color: #666;
      line-height: 1.8;
    }
    .warning {
      background-color: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 15px;
      border-radius: 5px;
      margin-top: 20px;
      color: #856404;
      font-size: 14px;
    }
    @media (max-width: 768px) {
      .herb-img-box {
        flex: 0 0 100%;
      }
    }
  </style>
</head>
<body>
<a href="fanhui" class="back-btn">← 返回中草药列表</a>

<div class="detail-container">
  <div class="herb-img-box">
    <img src="img/沙参.jpg" alt="茯苓" class="herb-detail-img">
    <div class="img-bottom-info">
      <div class="img-info-item"><span class="img-info-label">别名：</span>茯菟、茯灵、松苓</div>
      <div class="img-info-item"><span class="img-info-label">产地：</span>安徽、湖北、河南</div>
      <div class="img-info-item"><span class="img-info-label">采收：</span>7～9月采挖，阴干</div>
    </div>
  </div>
  <div class="herb-info-box">
    <h1 class="herb-title">茯苓</h1>
    <span class="herb-english">Poria</span>
    <span class="herb-tag">利湿</span>

    <div class="info-section">
      <h2 class="section-title">性味归经</h2>
      <div class="section-content">
        性平，味甘、淡；归心、肺、脾、肾经
      </div>
    </div>

    <div class="info-section">
      <h2 class="section-title">功效与应用</h2>
      <div class="section-content">
        核心功效为利水渗湿，健脾，宁心。是四君子汤的组成药材之一。<br><br>
        主要应用：<br>
        1. 水肿尿少，痰饮咳喘；<br>
        2. 脾虚食少，便溏泄泻；<br>
        3. 心神不安，惊悸失眠。
      </div>
    </div>

    <div class="info-section">
      <h2 class="section-title">用法用量</h2>
      <div class="section-content">
        煎服，10～15g。亦可打成粉冲服或入膳。
      </div>
    </div>

    <div class="warning">
      <strong>注意事项：</strong>阴虚火旺者慎服。
    </div>
  </div>
</div>
</body>
</html>
