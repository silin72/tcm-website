<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 中医药材网</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f8f5f2;
        }

        /* 顶部导航栏 */
        .header {
            width: 100%;
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f5f5f5;
            border-bottom: 1px solid #e0e0e0;
            position: sticky;
            top: 0;
            z-index: 999;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 35px;
        }
        .nav-left a {
            font-size: 15px;
            color: #666;
            text-decoration: none;
            transition: color 0.3s;
        }
        .nav-left a:hover {
            color: #b8860b;
        }
        .nav-left a.active {
            color: #b8860b;
            font-weight: 500;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-box input {
            width: 220px;
            padding: 8px 35px 8px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background-color: #e8e8e8;
            font-size: 14px;
            outline: none;
        }
        .search-box input::placeholder {
            color: #999;
        }
        .search-box .search-icon {
            position: absolute;
            right: 12px;
            color: #666;
            cursor: pointer;
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid #b8860b;
        }

        /* 主体内容 */
        .main-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            gap: 30px;
        }

        /* 左侧个人信息卡片 */
        .profile-sidebar {
            width: 300px;
            flex-shrink: 0;
        }
        .profile-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            cursor: pointer;
            border-radius: 50%;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #b8860b;
        }
        .avatar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .avatar-wrapper:hover .avatar-overlay {
            opacity: 1;
        }
        .profile-name {
            font-size: 20px;
            font-weight: 600;
            color: #212121;
            margin-bottom: 5px;
        }
        .profile-level {
            font-size: 14px;
            color: #b8860b;
            margin-bottom: 20px;
        }
        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 20px 0;
            border-top: 1px solid #f0f0f0;
            border-bottom: 1px solid #f0f0f0;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 20px;
            font-weight: 600;
            color: #212121;
        }
        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        .profile-menu {
            margin-top: 20px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: #666;
            margin-bottom: 8px;
        }
        .menu-item:hover, .menu-item.active {
            background: #f5f7fa;
            color: #b8860b;
        }
        .menu-item.logout-item:hover {
            background: #fff2f0;
            color: #ff4d4f;
        }
        .menu-icon {
            font-size: 18px;
        }

        /* 右侧内容区 */
        .profile-content {
            flex: 1;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .content-title {
            font-size: 18px;
            font-weight: 600;
            color: #212121;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        .info-form {
            display: grid;
            gap: 20px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .form-group input, .form-group textarea {
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            background: #fafafa;
            transition: all 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #b8860b;
            background: white;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .save-btn {
            margin-top: 20px;
            padding: 12px 32px;
            background: #b8860b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .save-btn:hover {
            background: #9a7209;
        }

        /* 收藏内容 */
        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .favorite-item {
            background: #f5f7fa;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .favorite-item:hover {
            transform: translateY(-4px);
        }
        .favorite-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        .favorite-info {
            padding: 12px;
        }
        .favorite-title {
            font-size: 14px;
            color: #212121;
            margin-bottom: 4px;
        }
        .favorite-type {
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <nav class="nav-left">
            <a href="index.html">首页</a>
            <a href="1.html">中药图谱</a>
            <a href="prescription.html">经典方剂</a>
            <a href="recipe.html">养生食谱</a>
            <a href="viewports.html">知识库</a>
            <a href="community.html">问答社区</a>
            <a href="articles.html">养生文章</a>
        </nav>
        <div class="nav-right">
            <a href="profile.html">
                <img src="img/枸杞头像.jpg" alt="用户头像" class="user-avatar" id="navAvatar" onerror="this.src='https://via.placeholder.com/36'">
            </a>
        </div>
    </header>

    <!-- 主体内容 -->
    <div class="main-container">
        <!-- 左侧边栏 -->
        <div class="profile-sidebar">
            <div class="profile-card">
                <div class="avatar-wrapper" onclick="document.getElementById('avatarInput').click()">
                    <img src="img/枸杞头像.jpg" alt="用户头像" class="profile-avatar" id="profileAvatar" onerror="this.src='https://via.placeholder.com/100'">
                    <div class="avatar-overlay">更换头像</div>
                    <input type="file" id="avatarInput" accept="image/*" style="display: none;" onchange="changeAvatar(this)">
                </div>
                <div class="profile-name">枸杞小子</div>
                <div class="profile-level">Lv.5 养生达人</div>
                <div class="profile-stats">
                    <div class="stat-item">
                        <div class="stat-value">128</div>
                        <div class="stat-label">收藏</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">56</div>
                        <div class="stat-label">点赞</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">23</div>
                        <div class="stat-label">评论</div>
                    </div>
                </div>
                <div class="profile-menu">
                    <div class="menu-item active" onclick="showTab('info')">
                        <span class="menu-icon">👤</span>
                        <span>个人资料</span>
                    </div>
                    <div class="menu-item" onclick="showTab('favorites')">
                        <span class="menu-icon">⭐</span>
                        <span>我的收藏</span>
                    </div>
                    <div class="menu-item" onclick="showTab('history')">
                        <span class="menu-icon">📖</span>
                        <span>浏览历史</span>
                    </div>
                    <div class="menu-item" onclick="showTab('settings')">
                        <span class="menu-icon">⚙️</span>
                        <span>账号设置</span>
                    </div>
                    <div class="menu-item logout-item" onclick="logout()">
                        <span class="menu-icon">🚪</span>
                        <span>退出登录</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧内容 -->
        <div class="profile-content">
            <!-- 个人资料 -->
            <div id="tab-info" class="tab-content">
                <div class="content-title">个人资料</div>
                <form class="info-form" id="profileForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>用户名</label>
                            <input type="text" id="username" placeholder="请输入用户名">
                        </div>
                        <div class="form-group">
                            <label>手机号</label>
                            <input type="tel" id="phone" placeholder="请输入手机号">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>邮箱</label>
                            <input type="email" id="email" placeholder="请输入邮箱">
                        </div>
                        <div class="form-group">
                            <label>性别</label>
                            <input type="text" id="gender" value="男" placeholder="请输入性别">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>个人简介</label>
                        <textarea id="bio" placeholder="介绍一下自己...">热爱中医药文化，喜欢研究养生食谱。</textarea>
                    </div>
                    <button type="button" class="save-btn" onclick="saveProfile()">保存修改</button>
                </form>
            </div>

            <!-- 我的收藏 -->
            <div id="tab-favorites" class="tab-content" style="display: none;">
                <div class="content-title">我的收藏</div>
                <div class="favorites-grid">
                    <div class="favorite-item">
                        <img src="img/当归.jpg" alt="当归" class="favorite-img">
                        <div class="favorite-info">
                            <div class="favorite-title">当归</div>
                            <div class="favorite-type">药材</div>
                        </div>
                    </div>
                    <div class="favorite-item">
                        <img src="img/当归生姜牛肉汤.jpg" alt="当归生姜牛肉汤" class="favorite-img">
                        <div class="favorite-info">
                            <div class="favorite-title">当归生姜牛肉汤</div>
                            <div class="favorite-type">食谱</div>
                        </div>
                    </div>
                    <div class="favorite-item">
                        <img src="img/黄芪.jpg" alt="黄芪" class="favorite-img">
                        <div class="favorite-info">
                            <div class="favorite-title">黄芪</div>
                            <div class="favorite-type">药材</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 浏览历史 -->
            <div id="tab-history" class="tab-content" style="display: none;">
                <div class="content-title">浏览历史</div>
                <p style="color: #999; text-align: center; padding: 40px;">暂无浏览记录</p>
            </div>

            <!-- 账号设置 -->
            <div id="tab-settings" class="tab-content" style="display: none;">
                <div class="content-title">账号设置</div>
                <form class="info-form">
                    <div class="form-group">
                        <label>当前密码</label>
                        <input type="password" placeholder="请输入当前密码">
                    </div>
                    <div class="form-group">
                        <label>新密码</label>
                        <input type="password" placeholder="请输入新密码">
                    </div>
                    <div class="form-group">
                        <label>确认新密码</label>
                        <input type="password" placeholder="请再次输入新密码">
                    </div>
                    <button type="button" class="save-btn" onclick="alert('密码修改成功！')">修改密码</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // 当前登录账号（由后端注入），作为资料默认值
        var loginUsername = /*[[${currentUsername}]]*/ '枸杞小子';
        var loginTel = /*[[${currentTel}]]*/ '138****8888';

        function showTab(tabName) {
            // 隐藏所有标签页
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.style.display = 'none';
            });
            // 显示当前标签页
            document.getElementById('tab-' + tabName).style.display = 'block';
            
            // 更新菜单激活状态
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
        }

        // 更换头像功能
        function changeAvatar(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                
                // 检查文件类型
                if (!file.type.startsWith('image/')) {
                    alert('请选择图片文件！');
                    return;
                }
                
                // 检查文件大小（限制2MB）
                if (file.size > 2 * 1024 * 1024) {
                    alert('图片大小不能超过2MB！');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    const avatarData = e.target.result;
                    
                    // 保存到 localStorage
                    localStorage.setItem('userAvatar', avatarData);
                    
                    // 更新头像显示
                    document.getElementById('profileAvatar').src = avatarData;
                    
                    // 同时更新导航栏头像
                    document.getElementById('navAvatar').src = avatarData;
                    
                    alert('头像更换成功！');
                };
                reader.readAsDataURL(file);
            }
        }

        // 页面加载时读取保存的头像
        window.addEventListener('load', function() {
            const savedAvatar = localStorage.getItem('userAvatar');
            if (savedAvatar) {
                document.getElementById('profileAvatar').src = savedAvatar;
                document.getElementById('navAvatar').src = savedAvatar;
            }
            
            // 读取保存的个人资料
            loadProfile();
        });
        
        // 保存个人资料
        function saveProfile() {
            const profile = {
                username: document.getElementById('username').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                gender: document.getElementById('gender').value,
                bio: document.getElementById('bio').value
            };
            
            localStorage.setItem('userProfile', JSON.stringify(profile));
            
            // 更新左侧显示的用户名
            document.querySelector('.profile-name').textContent = profile.username;
            
            alert('保存成功！');
        }
        
        // 加载个人资料
        function loadProfile() {
            const savedProfile = localStorage.getItem('userProfile');
            if (savedProfile) {
                const profile = JSON.parse(savedProfile);
                document.getElementById('username').value = profile.username || loginUsername;
                document.getElementById('phone').value = profile.phone || loginTel;
                document.getElementById('email').value = profile.email || '';
                document.getElementById('gender').value = profile.gender || '男';
                document.getElementById('bio').value = profile.bio || '热爱中医药文化，喜欢研究养生食谱。';
                document.querySelector('.profile-name').textContent = profile.username || loginUsername;
            }
        }

        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                // 清除登录相关信息
                localStorage.removeItem('userProfile');
                localStorage.removeItem('userAvatar');
                // 跳转到登录页面
                window.location.href = '/login';
            }
        }
    </script>
</body>
</html>
